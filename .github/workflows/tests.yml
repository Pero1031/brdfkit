name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # synthetic-data self-checks; the real-data tests skip themselves when the datasets are absent
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tests/run_tests.py

  cpp-msvc:
    # the C++ decoder header must build warning-clean at /W4 with the same command as cpp/build_test.bat
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /nologo /O2 /EHsc /std:c++17 /W4 /utf-8 test_decoder.cpp /Fe:test_decoder.exe
        working-directory: cpp
        shell: cmd
